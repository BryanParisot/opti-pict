name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check PHP syntax
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Check JavaScript syntax
        run: |
          node --check assets/admin.js
          node --check assets/admin-seo.js

      - name: Reject likely committed OpenAI keys
        run: |
          if git grep -nE 'sk-(proj-)?[A-Za-z0-9_-]{20,}' -- . ':(exclude).github/workflows/quality.yml'; then
            echo 'A likely OpenAI API key was found. Revoke it and remove it from Git history.'
            exit 1
          fi
